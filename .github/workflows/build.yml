name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: npm install
      
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk option-scanner-v5.3.apk
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: option-scanner-debug
          path: option-scanner-v5.3.apk
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.${{ github.run_number }}
          name: اسکنر آپشن v5.3.${{ github.run_number }}
          body: |
            🎉 نسخه جدید اسکنر آپشن
            
            **ویژگی‌ها:**
            - اسکن اسپرد (Bull/Bear Call/Put)
            - قیمت پایه زنده از TSE
            - Greeks, PoP, Win Score
            - فیلتر نقدشوندگی
            - Payoff Diagram
            - Auto-refresh
          files: option-scanner-v5.3.apk
          draft: false
          prerelease: false
